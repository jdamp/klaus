telegram:
  tokenFile: .local/secrets/telegram-token
  allowedUsers:
    - "111111111"
    - "222222222"
  allowedChats:
    - "111111111"
    - "222222222"
    - "-1003333333333"
  pollingTimeoutSeconds: 30

# Optional: replace the built-in household prompt with an explicit UTF-8 file.
# agent:
#   systemPromptFile: .local/AGENTS.md

# Shared notebook bounds are UTF-8 bytes. Lower values are rejected at startup
# if existing notes would no longer fit an exact read.
memory:
  overviewMaxBytes: 8192
  readMaxBytes: 16384
  listSearchMaxBytes: 16384
  maxResults: 20
  titleMaxBytes: 256
  tagMaxBytes: 64
  maxTags: 20
  previewMaxBytes: 240

model:
  provider: openai-codex
  id: gpt-5.4
  reasoning: medium
  authPath: .local/pi-auth/auth.json
  contextTokens: 64000
  retryLimit: 2

# Optional native Mealie integration. The API key is read from a mounted secret file.
# mealie:
#   baseUrl: https://mealie.example.invalid
#   apiKeyFile: .local/secrets/mealie-api-key
#   requestTimeoutMs: 30000
#   importTimeoutMs: 180000
#   maxResponseBytes: 1048576
#   maxResultBytes: 65536

mcp:
  - id: home
    url: https://mcp.example.invalid/mcp
    tokenFile: .local/secrets/home-mcp-token
    timeoutMs: 15000
    maxResultBytes: 65536

skills:
  paths: []

data:
  directory: .local/data
  retentionDays: 90

health:
  host: 127.0.0.1
  port: 8080
