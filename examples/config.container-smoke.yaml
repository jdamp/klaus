telegram:
  tokenFile: /run/secrets/telegram/token
  allowedUsers: ["111111111"]
  allowedChats: ["111111111"]
  pollingTimeoutSeconds: 1
  visualInput:
    maxBytes: 10485760
    downloadTimeoutMs: 15000

# Optional: replace the built-in household prompt with an explicit UTF-8 file.
# agent:
#   systemPromptFile: /etc/klaus-agent/AGENTS.md

# Optional text-to-image capability. Omit this block to keep image generation disabled.
# imageGeneration:
#   backend:
#     type: openai-codex
#   promptMaxBytes: 16384
#   requestTimeoutMs: 180000
#   maxResponseBytes: 16777216
#   maxImageBytes: 10485760

memory:
  overviewMaxBytes: 8192
  readMaxBytes: 16384
  listSearchMaxBytes: 16384
  maxResults: 20
  titleMaxBytes: 256
  tagMaxBytes: 64
  maxTags: 20
  previewMaxBytes: 240

model:
  provider: openai-codex
  id: gpt-5.4
  reasoning: medium
  authPath: /var/lib/klaus-agent-auth/auth.json
  contextTokens: 4096
  retryLimit: 0

mcp: []
skills:
  paths: []

data:
  directory: /var/lib/klaus-agent
  retentionDays: 1

health:
  host: 127.0.0.1
  port: 18081
