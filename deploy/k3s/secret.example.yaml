apiVersion: v1
kind: Secret
metadata:
  name: klaus-agent-secrets
  namespace: klaus
type: Opaque
stringData:
  telegram-token: REPLACE_WITH_TEST_BOT_TOKEN
  home-mcp-token: REPLACE_WITH_MCP_BEARER_TOKEN
  kaneo-api-key: REPLACE_WITH_KANEO_API_KEY
  # Used only when the optional mealie section is enabled in the ConfigMap.
  mealie-api-key: REPLACE_WITH_MEALIE_API_KEY
